name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (for example, v0.9.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build HACS release ZIP
        # The Marketplace extracts the asset into custom_components/ista_calista,
        # so the integration files are the root of the archive.
        run: |
          mkdir -p dist
          cd custom_components/ista_calista
          zip -r "$GITHUB_WORKSPACE/dist/ista_calista.zip" . \
            -x "*/__pycache__/*" "*.pyc" "*.pyo" "*/__pycache__" ".ruff_cache/*"

      - name: Validate release ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("dist/ista_calista.zip")
          with ZipFile(archive) as zip_file:
              names = zip_file.namelist()
              assert "manifest.json" in names, "manifest.json must be at the root of the ZIP"
              assert not any(
                  name.startswith("custom_components/") for name in names
              ), "The ZIP must not carry a custom_components/ prefix"
              assert not any(
                  "__pycache__" in name or name.endswith((".pyc", ".pyo"))
                  for name in names
              ), "Generated Python files must not be released"
              for required in ("__init__.py", "sensor.py", "binary_sensor.py", "button.py"):
                  assert required in names, f"{required} is missing"
          PY

      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with 'v'" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/ista_calista.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/ista_calista.zip \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
